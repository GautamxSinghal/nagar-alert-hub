spring.application.name=NagarAlertHub

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:alertdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate auto table generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Groq API Key for Department Classifier
groq.api.key=YOUR_GROQ_API_KEY_HERE

# File Upload Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Twilio WhatsApp Configuration
# Replace these with your actual Twilio Account credentials
twilio.account.sid=YOUR_TWILIO_SID_HERE
twilio.auth.token=YOUR_TWILIO_AUTH_TOKEN_HERE
twilio.whatsapp.from=whatsapp:+14155238886
