<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>My Profile - Nagar Alert Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            background-image:
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 0.2) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 0.2) 0, transparent 50%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="text-slate-200 font-sans p-4 sm:p-8">

    <!-- Navbar -->
    <nav class="max-w-5xl mx-auto flex items-center justify-between mb-12">
        <a href="/" class="text-2xl font-bold text-white tracking-wider hover:text-blue-400 transition">Nagar Alert
            Hub</a>
        <div class="flex items-center space-x-4">
            <a href="/" class="text-sm font-semibold text-slate-300 hover:text-white transition">← Back to Hub</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-2xl mx-auto">
        <div class="glass-card rounded-3xl p-8 sm:p-12 shadow-2xl shadow-black/50 relative overflow-hidden">
            <!-- Decorative circle -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-500/20 rounded-full blur-3xl pointer-events-none">
            </div>

            <!-- Success Message -->
            <div th:if="${param.success}"
                class="mb-8 p-4 bg-green-500/20 border border-green-500/50 rounded-xl text-green-300 text-center font-medium shadow-lg backdrop-blur-sm">
                Profile updated successfully!
            </div>

            <div class="flex flex-col sm:flex-row items-center gap-8 mb-10">
                <div class="relative">
                    <img th:if="${appUser.profileImage != null}" th:src="${appUser.profileImage}" alt="Profile Picture"
                        class="w-32 h-32 rounded-full border-4 border-slate-700 shadow-xl object-cover">
                    <div th:unless="${appUser.profileImage != null}"
                        class="w-32 h-32 rounded-full border-4 border-slate-700 shadow-xl bg-slate-800 flex items-center justify-center text-5xl">
                        👤
                    </div>
                    <div class="absolute bottom-0 right-0 bg-blue-500 p-2 rounded-full shadow-lg"
                        title="Verified via Google">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7">
                            </path>
                        </svg>
                    </div>
                </div>

                <div class="text-center sm:text-left">
                    <h1 class="text-3xl font-bold text-white mb-2" th:text="${appUser.name}">Citizen Name</h1>
                    <p class="text-slate-400 font-medium" th:text="${appUser.email}">email@example.com</p>
                    <div
                        class="mt-3 inline-flex items-center gap-2 bg-blue-500/10 text-blue-400 px-3 py-1 rounded-full text-xs font-bold border border-blue-500/20">
                        Citizen Account
                    </div>
                </div>
            </div>

            <hr class="border-slate-700/50 mb-10">

            <form th:action="@{/profile}" method="post" class="space-y-6">

                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">Phone Number
                        <span class="text-slate-500 normal-case">(Used for tracking alerts)</span></label>
                    <input type="tel" name="mobileNumber" th:value="${appUser.mobileNumber}"
                        class="w-full bg-slate-900/50 border border-slate-600 rounded-xl p-4 text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none placeholder-slate-600 transition"
                        placeholder="Enter your mobile number">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">Date of Birth
                        <span class="text-slate-500 normal-case">(Optional)</span></label>
                    <input type="date" name="dob" th:value="${appUser.dob}"
                        class="w-full bg-slate-900/50 border border-slate-600 rounded-xl p-4 text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none placeholder-slate-600 transition [color-scheme:dark]">
                </div>

                <div class="pt-6 flex flex-col sm:flex-row gap-4 items-center sm:justify-start">
                    <button type="submit"
                        class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-8 rounded-xl shadow-lg shadow-blue-900/30 transition-all hover:-translate-y-0.5">
                        Save Changes
                    </button>
                </div>
            </form>

            <div class="mt-8 pt-8 border-t border-slate-700/50">
                <form action="/logout" method="post">
                    <button type="submit"
                        class="w-full sm:w-auto bg-red-600/20 hover:bg-red-600/40 text-red-400 border border-red-600/50 font-bold py-3 px-8 rounded-xl transition-all flex items-center justify-center gap-2 mx-auto sm:mx-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                            </path>
                        </svg>
                        Logout
                    </button>
                </form>
            </div>

        </div>
    </div>

</body>

</html>
