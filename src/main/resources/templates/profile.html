<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>My Profile - Nagar Alert Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
    <th:block th:replace="~{accessibility :: accessibility-styles}"></th:block>
</head>

<body class="bg-slate-950 text-white min-h-screen flex flex-col relative">

    <header class="sticky top-0 w-full z-50">
        <th:block th:replace="~{accessibility :: accessibility-top-bar}"></th:block>
    </header>

    <main class="flex-grow p-2 sm:p-6 md:p-8 flex flex-col">
        <!-- Navbar -->
    <nav class="max-w-4xl mx-auto w-full flex items-center justify-between mb-6 sm:mb-8 md:mb-12 glass px-3 sm:px-6 py-2.5 sm:py-3 rounded-xl sm:rounded-2xl shadow-sm border border-slate-700 mt-2 sm:mt-0">
        <div class="flex items-center space-x-2 sm:space-x-2.5">
            <div class="w-7 h-7 sm:w-8 sm:h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white shadow-sm">
                <span class="text-xs sm:text-sm">📢</span>
            </div>
            <a href="/" class="text-base sm:text-lg md:text-xl font-bold text-white tracking-tight hover:text-blue-400 transition">
                Nagar Alert Hub
            </a>
        </div>
        <div class="flex items-center">
            <a href="/" class="text-xs sm:text-sm font-semibold text-slate-400 hover:text-white hover:bg-slate-800/80 px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg transition border border-transparent hover:border-slate-700">← Back</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-2xl mx-auto w-full flex-grow">
        <div class="bg-slate-900/50 border border-slate-700 rounded-[1.5rem] shadow-xl backdrop-blur-sm p-5 sm:p-8 md:p-10 relative overflow-hidden">
            
            <!-- Decorative circle -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-500/10 rounded-full blur-3xl pointer-events-none opacity-60"></div>

            <!-- Success Message -->
            <div th:if="${param.success}" class="mb-6 sm:mb-8 p-3 sm:p-4 bg-green-900/30 border border-green-500/30 rounded-xl text-green-400 text-center text-xs sm:text-sm font-bold shadow-sm">
                Profile updated successfully!
            </div>

            <div class="flex flex-col sm:flex-row items-center sm:items-start gap-4 sm:gap-6 md:gap-8 mb-8 sm:mb-10 text-center sm:text-left relative z-10">
                <div class="relative shrink-0">
                    <img th:if="${appUser.profileImage != null}" th:src="${appUser.profileImage}" alt="Profile Picture"
                        class="w-24 h-24 sm:w-28 sm:h-28 md:w-32 md:h-32 rounded-full border-4 sm:border-[5px] border-slate-800 shadow-md object-cover bg-slate-900">
                    
                    <div th:unless="${appUser.profileImage != null}"
                        class="w-24 h-24 sm:w-28 sm:h-28 md:w-32 md:h-32 rounded-full border-4 sm:border-[5px] border-slate-800 shadow-md bg-slate-900 flex items-center justify-center text-4xl sm:text-5xl text-slate-700">
                        👤
                    </div>
                    
                    <div class="absolute bottom-1 right-1 md:bottom-2 md:right-2 bg-blue-600 p-1 sm:p-1.5 rounded-full shadow-sm border-2 border-slate-800" title="Verified via Google">
                        <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                </div>

                <div class="pt-2">
                    <h1 class="text-xl sm:text-2xl md:text-3xl font-extrabold text-white mb-1" th:text="${appUser.name}">Citizen Name</h1>
                    <p class="text-slate-400 font-medium text-xs sm:text-sm md:text-base" th:text="${appUser.email}">email@example.com</p>
                    <div class="mt-3 sm:mt-4 inline-flex items-center gap-1 sm:gap-1.5 bg-blue-900/30 text-blue-400 px-2.5 sm:px-3 py-1 rounded-md text-[10px] sm:text-[11px] font-bold border border-blue-500/30 uppercase tracking-wide">
                        <span class="opacity-70 text-[9px] sm:text-[10px]">⭐</span> Citizen Account
                    </div>
                </div>
            </div>

            <hr class="border-slate-800 mb-8 md:mb-10">

            <form th:action="@{/profile}" method="post" class="space-y-4 sm:space-y-6 max-w-lg">

                <div>
                    <label class="block text-[10px] sm:text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">
                        Phone Number <span class="text-slate-500 normal-case tracking-normal">(For tracking alerts)</span>
                    </label>
                    <input type="tel" name="mobileNumber" th:value="${appUser.mobileNumber}"
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-3 sm:p-3.5 text-sm sm:text-base text-white focus:border-blue-500 focus:ring-2 focus:ring-blue-900/50 focus:outline-none placeholder-slate-600 transition"
                        placeholder="e.g. 9876543210">
                </div>

                <div>
                    <label class="block text-[10px] sm:text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">
                        Date of Birth <span class="text-slate-500 normal-case tracking-normal">(Optional)</span>
                    </label>
                    <input type="date" name="dob" th:value="${appUser.dob}"
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-3 sm:p-3.5 text-white focus:border-blue-500 focus:ring-2 focus:ring-blue-900/50 focus:outline-none text-sm sm:text-base transition style-date">
                </div>

                <div class="pt-2 sm:pt-4">
                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 sm:py-3.5 rounded-xl shadow-sm hover:shadow-md hover:shadow-blue-200 transition-all active:scale-[0.98] text-sm sm:text-base">
                        Save Changes
                    </button>
                </div>
            </form>

            <div class="mt-10 pt-8 border-t border-slate-800">
                <form action="/logout" method="post">
                    <button type="submit" class="w-full sm:w-auto bg-slate-900 hover:bg-red-900/30 text-red-400 border border-slate-700 hover:border-red-500/30 font-bold py-3 px-8 rounded-xl transition-all flex items-center justify-center gap-2 mx-auto sm:mx-0 shadow-sm active:scale-[0.98]">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                        Logout
                    </button>
                </form>
            </div>

        </div>
    </div>
    <th:block th:replace="~{accessibility :: accessibility-widget}"></th:block>
    </main>
</body>
</html>
