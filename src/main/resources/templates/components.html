<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- ========================= -->
    <!-- Alert Card Fragment        -->
    <!-- ========================= -->
    <th:block th:fragment="alertCard(alert)">
        <div class="group relative overflow-hidden bg-white rounded-xl border border-gray-200 transition-all duration-200 hover:shadow-md hover:border-gray-300">
            
            <!-- Severity Accent Bar -->
            <div class="absolute left-0 top-0 bottom-0 w-1 md:w-1.5 rounded-l-xl" 
                 th:classappend="${alert.severity?.name() == 'CRITICAL'} ? 'bg-red-500' : 
                                (${alert.severity?.name() == 'HIGH'} ? 'bg-orange-500' : 
                                (${alert.severity?.name() == 'MEDIUM'} ? 'bg-yellow-500' : 'bg-blue-500'))">
            </div>

            <div class="p-3.5 pl-5 md:p-4 md:pl-6 flex justify-between items-start gap-3">
                <div class="space-y-1.5 md:space-y-2 flex-1 min-w-0">
                    <!-- Status + Severity + Location -->
                    <div class="flex items-center flex-wrap gap-1.5 md:gap-2">
                        <span th:if="${alert.status?.name() == 'RESOLVED'}" class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] md:text-xs font-bold bg-green-50 text-green-700 border border-green-200">
                            <span class="mr-1">✅</span> RESOLVED
                        </span>
                        <span th:if="${alert.status?.name() == 'IN_PROGRESS'}" class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] md:text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200">
                            <span class="mr-1">👷</span> IN PROGRESS
                        </span>
                        <span th:if="${alert.status?.name() == 'PENDING'}" class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] md:text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200">
                            <span class="mr-1">⏳</span> PENDING
                        </span>
                        
                        <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] md:text-xs font-bold uppercase tracking-wide border"
                              th:classappend="${alert.severity?.name() == 'CRITICAL'} ? 'bg-red-50 text-red-700 border-red-200' : 
                                              (${alert.severity?.name() == 'HIGH'} ? 'bg-orange-50 text-orange-700 border-orange-200' : 
                                              (${alert.severity?.name() == 'MEDIUM'} ? 'bg-yellow-50 text-yellow-700 border-yellow-200' : 
                                              'bg-blue-50 text-blue-700 border-blue-200'))" th:text="${alert.severity}">SEVERITY</span>
                        
                        <span class="text-gray-500 font-medium text-[11px] md:text-xs flex items-center w-full sm:w-auto mt-0.5 sm:mt-0">
                            <span class="mr-1 opacity-60 text-xs">📍</span>
                            <span class="truncate max-w-[180px] md:max-w-[280px]" th:text="${alert.location}">Location</span>
                        </span>
                    </div>

                    <!-- Description -->
                    <p class="text-gray-700 text-[13px] md:text-sm leading-relaxed line-clamp-2 md:line-clamp-none" th:text="${alert.description}">Description...</p>
                    
                    <!-- Meta Row -->
                    <div class="pt-0.5 flex flex-wrap items-center text-[10px] md:text-[11px] text-gray-400 gap-3 md:gap-4">
                        <div class="flex items-center">
                            <span class="mr-1">🕒</span>
                            <span th:text="${#temporals.format(alert.timestamp, 'dd MMM, hh:mm a')}">Time</span>
                        </div>
                        <div class="flex items-center">
                            <span class="mr-1">🏢</span>
                            <span th:text="${alert.department}" class="text-gray-500 font-medium">DEPT</span>
                        </div>
                        <form th:action="@{/alert/{id}/upvote(id=${alert.alertId})}" method="post" class="flex items-center m-0">
                            <button type="submit" class="flex items-center gap-1 px-2.5 py-0.5 md:py-1 rounded-lg bg-gray-50 text-gray-600 border border-gray-200 hover:border-blue-300 hover:bg-blue-50 hover:text-blue-700 transition-all duration-200">
                                <span>👍</span>
                                <span class="font-bold" th:text="${alert.upvotes}">0</span>
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Department Icon -->
                <div class="hidden sm:flex items-center justify-center w-11 h-11 md:w-12 md:h-12 rounded-xl bg-gray-50 text-xl md:text-2xl border border-gray-200 shrink-0 group-hover:bg-blue-50 group-hover:border-blue-200 transition-colors">
                    <span th:if="${alert.department == 'Police'}">👮</span>
                    <span th:if="${alert.department == 'Fire'}">🚒</span>
                    <span th:if="${alert.department == 'Medical'}">🚑</span>
                    <span th:if="${alert.department == 'Electrical'}">⚡</span>
                    <span th:if="${alert.department == 'Municipal'}">🏗️</span>
                    <span th:if="${alert.department == 'Traffic'}">🚦</span>
                    <span th:if="${alert.department == null}">📢</span>
                </div>
            </div>
        </div>
    </th:block>


    <!-- ========================= -->
    <!-- Report Form Fragment       -->
    <!-- ========================= -->
    <th:block th:fragment="reportFormFields(suffix)">
        <input type="hidden" th:id="'latInput' + ${suffix}" name="latitude">
        <input type="hidden" th:id="'lngInput' + ${suffix}" name="longitude">
        
        <!-- Location -->
        <div>
            <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-[0.12em] mb-1.5" data-i18n="label_location">Location</label>
            <div class="space-y-2">
                <input type="text" th:id="'locationInput' + ${suffix}" name="location" placeholder="Enter landmark..." data-i18n-placeholder="ph_location" required
                       class="w-full p-2.5 md:p-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-blue-400 focus:ring-2 focus:ring-blue-100 text-gray-800 text-sm placeholder-gray-400 transition-all duration-200 outline-none">
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" th:data-suffix="${suffix}" onclick="detectLocation(this.dataset.suffix)" 
                            class="bg-green-50 text-green-700 border border-green-200 py-2.5 rounded-xl text-xs font-bold flex justify-center items-center hover:bg-green-100 hover:border-green-300 transition-all active:scale-95">
                        <span class="mr-1.5">🎯</span> GPS
                    </button>
                    <button type="button" th:data-suffix="${suffix}" onclick="openMap(this.dataset.suffix)" 
                            class="bg-blue-50 text-blue-700 border border-blue-200 py-2.5 rounded-xl text-xs font-bold flex justify-center items-center hover:bg-blue-100 hover:border-blue-300 transition-all active:scale-95">
                        <span class="mr-1.5">🗺️</span> Map
                    </button>
                </div>
            </div>
        </div>

        <!-- Phone -->
        <div sec:authorize="!isAuthenticated()">
            <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-[0.12em] mb-1.5">
                <span data-i18n="label_phone">Phone Number</span> 
                <span class="text-gray-300 lowercase font-normal tracking-normal" data-i18n="label_phone_opt">(Optional)</span>
            </label>
            <input type="text" name="phoneNumber" placeholder="e.g. 9876543210" 
                   class="w-full p-2.5 md:p-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-blue-400 focus:ring-2 focus:ring-blue-100 text-gray-800 text-sm placeholder-gray-400 transition-all duration-200 outline-none">
        </div>

        <!-- Description -->
        <div>
            <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-[0.12em] mb-1.5" data-i18n="label_desc">Description</label>
            <textarea name="description" rows="3" placeholder="Describe the incident..." data-i18n-placeholder="ph_desc" required 
                      class="w-full p-2.5 md:p-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-blue-400 focus:ring-2 focus:ring-blue-100 text-gray-800 text-sm resize-none placeholder-gray-400 transition-all duration-200 outline-none"></textarea>
        </div>

        <!-- Photo -->
        <div>
            <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-[0.12em] mb-1.5">
                <span data-i18n="label_photo">Photo</span> 
                <span class="text-gray-300 lowercase font-normal tracking-normal" data-i18n="label_photo_opt">(Optional)</span>
            </label>
            <input type="file" name="image" accept="image/*" 
                   class="w-full p-2 rounded-xl bg-gray-50 border border-gray-200 text-gray-500 text-xs cursor-pointer
                          file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white file:font-semibold file:text-xs file:cursor-pointer file:hover:bg-blue-700 file:transition-colors">
        </div>

        <!-- Submit -->
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 md:py-3.5 rounded-xl transition-all duration-200 shadow-sm shadow-blue-200 hover:shadow-md hover:shadow-blue-200 flex justify-center items-center group active:scale-[0.98] mt-3">
            <span class="mr-2" data-i18n="btn_submit">Submit Report</span>
            <span class="group-hover:translate-x-1 transition-transform duration-200">→</span>
        </button>
    </th:block>
</body>
</html>
