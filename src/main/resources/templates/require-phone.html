<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Complete Your Profile - Nagar Alert Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 flex items-center justify-center min-h-screen text-slate-200 font-sans">

    <div class="w-full max-w-md p-8 bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 relative text-center">

        <h1 class="text-3xl font-bold text-white tracking-wider mb-2">Almost Done!</h1>
        <p class="text-slate-400 mb-8">
            Welcome, <span class="text-blue-400 font-semibold" th:text="${name}">User</span>! <br>
            Please provide your WhatsApp mobile number so you can track your reported alerts.
        </p>

        <form th:action="@{/submit-phone}" method="post" class="space-y-6">
            <div class="text-left">
                <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">WhatsApp Mobile Number</label>
                <div class="flex">
                    <span class="inline-flex items-center px-4 rounded-l bg-slate-700 border border-r-0 border-slate-600 text-slate-300 font-semibold">+91</span>
                    <input type="tel" name="mobileNumber" required pattern="[0-9]{10}"
                        class="w-full bg-slate-900 border border-slate-600 rounded-r p-3 text-white focus:border-blue-500 focus:outline-none placeholder-slate-600"
                        placeholder="e.g. 9876543210">
                </div>
                <p class="text-[10px] text-slate-500 mt-2">Required for receiving webhook updates via Twilio.</p>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded transition mt-4">
                Save & Continue
            </button>
        </form>
        
        <div class="mt-6">
            <a href="/logout" class="text-sm text-slate-500 hover:text-red-400 transition underline">Cancel & Logout</a>
        </div>
    </div>

</body>
</html>
